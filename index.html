<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Python Console</title>
    <!-- Load Pyodide -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: monospace; background-color: #1e1e1e; color: #ffffff; padding: 20px; }
        #console { width: 100%; height: 300px; background: #000; overflow-y: scroll; padding: 10px; box-sizing: border-box; }
        #input-line { display: flex; margin-top: 10px; }
        #prompt { color: #00ff00; margin-right: 10px; }
        #code-input { flex-grow: 1; background: transparent; border: none; color: #fff; font-family: monospace; outline: none; }
    </style>
</head>
<body>

    <h1>Interactive Python Console</h1>
    <div id="console">
        <div id="output">Loading Python environment (Pyodide)... Please wait.</div>
    </div>
    <div id="input-line">
        <span id="prompt">&gt;&gt;&gt;</span>
        <input type="text" id="code-input" disabled autocomplete="off">
    </div>

    <script>
        let pyodide;
        const outputDiv = document.getElementById('output');
        const inputField = document.getElementById('code-input');

        // Initialize Pyodide
        async function main() {
            pyodide = await loadPyodide();
            outputDiv.innerHTML += "<br>Python ready! Type your code below.<br>";
            inputField.disabled = false;
            inputField.focus();
        }
        main();

        // Capture input and execute it
        inputField.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                const code = inputField.value;
                if (!code.trim()) return;

                outputDiv.innerHTML += `<br><span style="color: #00ff00;">&gt;&gt;&gt; ${code}</span>`;
                inputField.value = '';

                try {
                    // Redirect standard output to our console
                    pyodide.runPython(`
                        import sys
                        import io
                        sys.stdout = io.StringIO()
                    `);

                    // Evaluate code
                    let result = await pyodide.runPythonAsync(code);

                    // Get printed text
                    let stdout = pyodide.runPython("sys.stdout.getvalue()");

                    if (stdout) outputDiv.innerHTML += `<br>${stdout.replace(/\n/g, '<br>')}`;
                    if (result !== undefined) outputDiv.innerHTML += `<br>${result}`;

                } catch (err) {
                    outputDiv.innerHTML += `<br><span style="color: #ff0000;">${err}</span>`;
                }

                // Auto-scroll to bottom
                const consoleDiv = document.getElementById('console');
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
            }
        });
    </script>
</body>
</html>
